# Optional: put nginx on the host in front of the frontend container
# (port 80 -> 8080, or whatever WEB_PORT is). Copy to
# /etc/nginx/sites-available/nearfit, edit server_name, then enable it.
# For HTTPS (needed for browser geolocation on a real domain): sudo certbot --nginx
server {
    listen 80;
    server_name your-domain.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
