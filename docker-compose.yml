# Four containers on a private network. Only the frontend publishes a port.
#   docker compose up --build        # then open http://localhost:8080
#   WEB_PORT=80 docker compose up -d # or pick another port
name: nearfit-microservices

services:
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    environment:
      GYM_SERVICE_URL: http://gym-service:4101
      REVIEW_SERVICE_URL: http://review-service:4102
    depends_on:
      gym-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gym-service:
    build: ./services/gym-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  review-service:
    build: ./services/review-service
    volumes:
      - reviews-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  reviews-data:
