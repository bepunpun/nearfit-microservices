server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, and a variable in proxy_pass, so nginx re-resolves the gateway
    # if its container is recreated instead of caching the old address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway http://gateway:4100;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a search can wait on Overpass for a while (see GYM_TIMEOUT_MS in the gateway)
        proxy_read_timeout 60s;
    }

    # single-page app: any other route gets index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
